<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>哆哆记账 · 猫咪主题设计</title><style>
* { box-sizing:border-box; }
body { margin:0; padding:42px 48px 28px; width:1240px; color:#303e2f; background:#eeeee3; font-family:-apple-system,"Microsoft YaHei",sans-serif; }
.eyebrow { font-size:12px; letter-spacing:3px; color:#657359; }
header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:28px; }
h1 { font-size:32px; font-weight:600; letter-spacing:-1px; margin:10px 0 0; }
header p { font-size:13px; color:#6a715d; text-align:right; line-height:1.8; margin:0 0 2px; }
.pages { display:flex; gap:30px; }
figure { margin:0; flex:1; min-width:0; }
.screen { width:100%; height:780px; border-radius:30px; overflow:hidden; background:#f7f7ef; border:1px solid #dfe3d3; box-shadow:0 10px 30px #303e2f0a; }
img { display:block; width:100%; height:auto; }
figcaption { font-size:13px; padding:16px 4px; color:#5a6750; }
footer { display:flex; justify-content:space-between; color:#737b67; font-size:11px; margin-top:8px; }
</style></head><body>
<header><div><div class="eyebrow">哆哆记账 / WHISK &amp; PURR</div><h1>日常有数，生活有猫。</h1></div><p>奶油纸色 · 深墨绿 · 手绘小猫<br>把日子过得有滋有味</p></header>
<div class="pages">
<figure><div class="screen"><img src="preview/ledger.png"></div><figcaption>01 / 账本与月度预算</figcaption></figure>
<figure><div class="screen"><img src="preview/record-detail.png"></div><figcaption>02 / 记账详情与计算器</figcaption></figure>
<figure><div class="screen"><img src="preview/profile.png"></div><figcaption>03 / 个人中心与呼噜厨房</figcaption></figure>
</div><footer><span>原生微信小程序界面 · 浏览器静态预览，最终效果以微信为准</span><span>2026.10</span></footer>
</body></html>
