function markup(text,scope,target) {
  const template = document.createElement('template');
  template.innerHTML = text.replace(/<image\b/g,'<img').replace(/<(?!img\b|input\b|br\b)([\w-]+)([^>]*?)\/>/g,'<$1$2></$1>').replace(/\s*\/>/g,'>');
  renderChildren([...template.content.childNodes],scope,target);
}
function act(handler,element) {
  if (handler === 'toggleHidden') { pageData.hidden = !pageData.hidden; draw(); }
  else if (handler === 'closeSwipe') { pageData.openSwipeId=''; draw(); }
  else if (handler === 'chooseCategory') { pageData.selectedCategory = pageData.categories.find(x=>x.id===element.dataset.id); pageData.selectedCategoryId=element.dataset.id; pageData.detailVisible=true; pageData.amount='0'; draw(); }
  else if (handler === 'closeDetail') { pageData.detailVisible=false; draw(); }
  else if (handler === 'setType') { const url = new URL(location); url.searchParams.set('page',current === 'record' ? 'record' : 'charts'); pageData.type=element.dataset.type; if(current==='record') pageData.categories=element.dataset.type==='income'?[{id:'salary',name:'工资',icon:'💼',color:'#CBE8D8'}]:source.pages.record.data.categories; draw(); }
  else if (handler === 'setPeriod') { pageData.period=element.dataset.period; draw(); }
  else if (handler === 'switchTab') location.search='?page='+element.dataset.path.split('/')[2];
  else if (handler === 'cancel') location.search='?page=ledger';
}
function draw() {
  const data = source.pages[current], root = document.querySelector('#root'); root.innerHTML='';
  document.querySelector('#page-style').textContent=(data.css+'\n'+source.tab.css).replace(/ image([ ,.{:>])/g,' img$1').replace(/(-?[\d.]+)rpx/g,(_,n)=>'calc('+n+' * 100vw / 750)');
  markup(data.wxml,pageData,root);
  const canvas=root.querySelector('canvas');
  if(canvas) {
    canvas.width=canvas.clientWidth*2; canvas.height=canvas.clientHeight*2;
    const ctx=canvas.getContext('2d'); ctx.scale(2,2); const w=canvas.clientWidth,h=canvas.clientHeight,pad=22;
    ctx.strokeStyle='#e6e8dc'; for(let i=1;i<=3;i++){const y=pad+(h-pad*2)*i/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();}
    const points=pageData.values.map((v,i)=>({x:pad+(w-pad*2)*i/(pageData.values.length-1),y:h-pad-(h-pad*2)*v/pageData.max}));
    ctx.strokeStyle=pageData.type==='expense'?'#A95344':'#425F40';ctx.lineWidth=3;ctx.beginPath();
    points.forEach((p,i)=>{if(!i)ctx.moveTo(p.x,p.y);else {const mid=(points[i-1].x+p.x)/2;ctx.bezierCurveTo(mid,points[i-1].y,mid,p.y,p.x,p.y)}});ctx.stroke();
  }
}
draw();
</script></body></html>
